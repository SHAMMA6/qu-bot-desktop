name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      # One platform failing should not stop the others from producing builds.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: --win
          - os: macos-latest
            name: mac
            args: --mac
          - os: ubuntu-latest
            name: linux
            args: --linux

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm test

      - name: Build
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # There is no signing certificate in CI; without this, electron-builder
          # tries to discover one on macOS and fails the build rather than
          # producing an unsigned app.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: qu-bot-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
          generate_release_notes: true
