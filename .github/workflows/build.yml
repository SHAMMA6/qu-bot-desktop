name: Build

# Continuous integration only: proves every push still builds on all three
# platforms and leaves the binaries as downloadable run artifacts.
#
# Releasing is deliberately NOT done here — that lives in release.yml, so there
# is exactly one path that can publish, and it is the one that also writes the
# update feed. Two workflows both attaching assets to the same tag is how you
# end up with a release whose metadata disagrees with its binaries.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: --win
          - os: macos-latest
            name: mac
            args: --mac
          - os: ubuntu-latest
            name: linux
            args: --linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm test

      - name: Build
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # The update feed is built here too, so a broken one shows up in CI rather
      # than at release time.
      - name: Check the update feed was generated
        shell: bash
        run: |
          if ! ls dist/latest*.yml >/dev/null 2>&1; then
            echo "::error::electron-builder produced no latest*.yml — auto-update would be dead"
            exit 1
          fi
          for f in dist/latest*.yml; do echo "--- $f"; cat "$f"; done

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: emoo-bot-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
